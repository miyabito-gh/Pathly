[package]
name = "pathly"
version = "0.1.0"
description = "A focused launcher for user-registered files and folders"
authors = ["Pathly"]
edition = "2021"

[[bin]]
name = "Pathly"
path = "src/main.rs"

[lib]
name = "pathly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
